[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "GPL-3.0-or-later"
rust-version = "1.90"

[workspace.dependencies]
cpal = { version = "0.18.2", features = ["realtime"] }
symphonia = { version = "0.6.1", default-features = false }
rubato = "5.0.1"
rtrb = "0.4.0"
midir = "0.11.1"
eframe = { version = "0.37.0", features = ["glow"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
uuid = { version = "1.28.0", features = ["v4", "serde"] }
blake3 = { version = "1.8.7", features = ["pure"] } # pure Rust: no C/asm toolchain needed on any target
tempfile = "3.27.0"
rfd = "0.17.2"
thiserror = "2.0.21"
anyhow = "1.0.104"
hound = "3.5.1"
assert_no_alloc = "1.1.2"
crossbeam-channel = "0.5.17"
directories = "6.0.0"
muda = { version = "0.21.2", default-features = false }
proptest = "1.12.0"
clap = { version = "4.6.7", features = ["derive"] }
sha2 = "0.10.9"
resvg = "0.45.1"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
debug = 1
