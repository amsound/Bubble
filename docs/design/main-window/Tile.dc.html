<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cart tile</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="{{root}}">
  <div style="{{content}}">
    <!-- Top row: number, group, trigger keycap -->
    <div style="display: flex; align-items: center; gap: 6px; padding: 8px 10px 0; min-height: 18px">
      <span style="font-size: 12px; font-variant-numeric: tabular-nums; opacity: 0.72">{{num}}</span>
      <sc-if value="{{group}}" hint-placeholder-val="{{false}}"><span style="font-size: 11px; line-height: 16px; padding: 0 6px; border-radius: 4px; background: rgba(255,255,255,0.2)">{{group}}</span></sc-if>
      <span style="flex: 1"></span>
      <sc-if value="{{key}}" hint-placeholder-val="{{false}}"><span style="font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 18px; padding: 0 6px; border-radius: 4px; background: rgba(255,255,255,0.88); color: {{bg}}">{{key}}</span></sc-if>
    </div>
    <!-- Label: "|" or Shift+Return is a line break -->
    <div style="{{labelStyle}}">{{label}}</div>
    <!-- Bottom row: output badge, icons, speed; time -->
    <div style="display: flex; align-items: center; gap: 5px; padding: 0 10px 17px; min-height: 22px">
      <sc-if value="{{out}}" hint-placeholder-val="{{false}}"><span style="{{badge}}">{{out}}</span></sc-if>
      <sc-for list="{{icons}}" as="ic" hint-placeholder-count="2">
        <svg width="14" height="14" viewBox="0 0 16 16" role="img" aria-label="{{ic.name}}" style="flex-shrink: 0; opacity: 0.9"><path d="{{ic.d}}" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path></svg>
      </sc-for>
      <sc-if value="{{speed}}" hint-placeholder-val="{{false}}"><span style="font-size: 11px; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 16px; padding: 0 5px; border-radius: 4px; background: rgba(255,255,255,0.2)">{{speed}}</span></sc-if>
      <!-- Not ready yet: a small spinner in the icon row (the global popover says why) -->
      <sc-if value="{{spinner}}" hint-placeholder-val="{{false}}"><span role="img" aria-label="Not ready yet" style="width: 10px; height: 10px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.3); border-top-color: rgba(255,255,255,0.95); animation: spin 0.9s linear infinite"></span></sc-if>
      <span style="flex: 1"></span>
      <span style="{{timeStyle}}">{{time}}</span>
    </div>
  </div>

  <!-- Empty cell -->
  <sc-if value="{{plus}}" hint-placeholder-val="{{false}}">
    <div style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 26px; font-weight: 300; color: {{emptyMark}}">+</div>
  </sc-if>

  <!-- Audio being copied into this cell: only a dashed outline and a quiet icon; the
       global busy popover carries the words and the progress -->
  <sc-if value="{{copying}}" hint-placeholder-val="{{false}}">
    <div style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center">
      <svg width="22" height="22" viewBox="0 0 16 16" role="img" aria-label="Audio arriving"><path d="M8 2v7.5M5 6.5l3 3 3-3M2.5 10.5v2a1 1 0 0 0 1 1h9a1 1 0 0 0 1-1v-2" fill="none" stroke="#8fb0ff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path></svg>
    </div>
  </sc-if>

  <!-- State frame: border and progress are one element -->
  <sc-if value="{{frame}}" hint-placeholder-val="{{false}}">
    <div style="{{frame}}"></div>
  </sc-if>
  <sc-if value="{{band}}" hint-placeholder-val="{{false}}">
    <div style="{{band}}"><div style="{{fill}}"></div></div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"t":{"editor":null},"w":{"editor":"int","default":228},"h":{"editor":"int","default":150},"$preview":{"width":228,"height":150}}'>
class Component extends DCLogic {
  renderVals() {
    const t = this.props.t || { num: 2, label: 'Bed|Music', bg: '#3A6EA5', state: 'playing', out: 'A', icons: ['loop', 'next'], time: '-01:12', progress: 0.42 };
    const w = this.props.w ?? 228;
    const h = this.props.h ?? 150;
    const light = !!t.light;
    const state = t.state || 'ready';
    const isEmpty = state === 'empty' || state === 'emptyShow' || state === 'copying';
    const bg = isEmpty ? (light ? '#d5dae0' : '#363a40') : (t.bg || '#3A6EA5');
    const fg = isEmpty ? (light ? '#5f6670' : '#e8e8e8') : '#ffffff';
    const paths = {
      loop: 'M2.5 7.5a5 5 0 0 1 8.6-3.5M13.5 8.5a5 5 0 0 1-8.6 3.5M11.5 1.5v2.8H8.7M4.5 14.5v-2.8h2.8',
      in: 'M6 3H4v10h2M8.5 8h5M11 5.5 13.5 8 11 10.5',
      out: 'M10 3h2v10h-2M2.5 8h5M5 5.5 2.5 8 5 10.5',
      inout: 'M5.5 3h-2v10h2M10.5 3h2v10h-2',
      stop: 'M4.5 4.5h7v7h-7z',
      next: 'M2.5 8h8M7.5 5l3 3-3 3M13 4v8',
      mute: 'M2 6h2.5L8 3v10L4.5 10H2zM10.5 6l4 4M14.5 6l-4 4',
      hold: 'M6 14V6.5a1.5 1.5 0 0 1 3 0V9h1.5a2 2 0 0 1 2 2v3',
      changed: 'M8 2.5l6 11H2zM8 6.5v3M8 11.5v.5',
      midi: 'M8 2a6 6 0 1 0 0 12A6 6 0 0 0 8 2zM5.5 7.5h.01M8 5.5h.01M10.5 7.5h.01M6.3 10.3h.01M9.7 10.3h.01'
    };
    const names = { loop: 'Loop', in: 'In point trimmed', out: 'Out point trimmed', inout: 'In and Out trimmed', stop: 'Stops others', next: 'Plays next', mute: 'Muted', hold: 'Hold to play', changed: 'File changed', midi: 'MIDI trigger' };
    const colours = { playing: '#ffd82e', fading: '#a855f7', ending: '#ff5a3c', learning: '#ff40ff', copying: '#2f6bff' };
    const rgba = (hex, a) => {
      const v = parseInt(hex.slice(1), 16);
      return 'rgba(' + (v >> 16) + ',' + ((v >> 8) & 255) + ',' + (v & 255) + ',' + a + ')';
    };
    const running = state === 'playing' || state === 'fading' || state === 'ending';
    const col = colours[state];
    let frame = '';
    if (running) frame = 'position: absolute; inset: 0; border-radius: 8px; box-shadow: inset 0 0 0 4px ' + col;
    if (state === 'learning') frame = 'position: absolute; inset: 0; border-radius: 8px; box-shadow: inset 0 0 0 4px ' + col + '; animation: pulse 1.1s ease-in-out infinite';
    if (state === 'copying') frame = 'position: absolute; inset: 0; border-radius: 8px; border: 2px dashed ' + rgba(col, 0.9);
    let band = '';
    let fill = '';
    const p = Math.max(0, Math.min(1, state === 'copying' ? (t.copy ?? 0.6) : (t.progress ?? 0)));
    if (running) {
      const c = col;
      // The band continues the border along the inside bottom edge, with the
      // border's inner corner radius: one shape.
      band = 'position: absolute; left: 4px; right: 4px; bottom: 4px; height: 8px; border-radius: 0 0 4px 4px; overflow: hidden; background: ' + rgba(c, 0.32);
      fill = 'height: 8px; width: ' + Math.round(p * 1000) / 10 + '%; background: ' + c;
    }
    const timeSize = Math.max(14, Math.min(22, Math.round(h / 7)));
    let timeStyle = 'font-size: ' + timeSize + 'px; font-variant-numeric: tabular-nums; letter-spacing: 0.01em; ' + (running ? 'font-weight: 700' : 'font-weight: 500');
    if (state === 'missing') timeStyle = 'font-size: 12px; font-weight: 700; letter-spacing: 0.06em; padding: 1px 6px; border-radius: 4px; background: rgba(0,0,0,0.35); color: #ffb4a8';
    const labelSize = Math.max(13, Math.min(26, Math.round(h / 6.5)));
    const control = state === 'control';
    return {
      root: 'position: relative; width: ' + w + 'px; height: ' + h + 'px; box-sizing: border-box; border-radius: 8px; overflow: hidden; font-family: -apple-system, \'SF Pro Text\', \'Segoe UI Variable Text\', \'Segoe UI\', system-ui, sans-serif; background: ' + bg + '; color: ' + fg + (t.selected ? '; box-shadow: 0 0 0 2px #1b1d21, 0 0 0 4px #80c0ff' : ''),
      content: 'position: absolute; inset: 0; display: flex; flex-direction: column;' + (state === 'missing' ? ' opacity: 0.5;' : '') + (state === 'loading' ? ' opacity: 0.55;' : '') + (isEmpty ? ' visibility: hidden;' : ''),
      num: t.num, group: t.group || '', key: t.key || '', bg,
      label: (t.label || '').replace(/\|/g, '\n'),
      labelStyle: 'flex: 1; display: flex; align-items: center; justify-content: center; text-align: center; white-space: pre-line; padding: 0 10px; line-height: 1.15; font-size: ' + labelSize + 'px; font-weight: ' + (control ? '700; letter-spacing: 0.04em' : '600'),
      out: control ? '' : (t.out || ''),
      badge: 'font-size: 11px; font-weight: 700; line-height: 16px; min-width: 16px; text-align: center; padding: 0 3px; box-sizing: border-box; border-radius: 4px; ' + (t.rerouted ? 'background: #ffb020; color: #000000' : 'background: rgba(255,255,255,0.24); color: #ffffff'),
      icons: (t.icons || []).map((k) => ({ d: paths[k], name: names[k] })),
      speed: t.speed || '',
      time: t.time || '',
      spinner: state === 'loading',
      timeStyle,
      plus: state === 'empty',
      emptyMark: light ? '#8a929c' : '#6a7078',
      copying: state === 'copying',
      frame, band, fill
    };
  }
}
</script>
</body>
</html>
