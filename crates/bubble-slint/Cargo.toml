[package]
name = "bubble-slint"
description = "Bubble cart player: the Slint interface (main window), on top of bubble-core."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "bubble-slint"
path = "src/main.rs"

[dependencies]
bubble-control = { path = "../bubble-control" }
bubble-core = { path = "../bubble-core" }
bubble-engine = { path = "../bubble-engine" }
bubble-project = { path = "../bubble-project" }
# Bubble is GPL-3.0-or-later, so Slint is used under its GPLv3 licence (D-38).
# `unstable-winit-030`: OS file drops, physical keys and the window's place, which
# Slint's own API does not report yet. Pinned: the winit accessor may change.
slint = { version = "=1.18.1", features = ["unstable-winit-030", "raw-window-handle-06"] }
mouse_position = "0.1.4"
# "Copy Details" in a problem alert.
arboard = "3"
# The main window as the owner of native alerts and the Save panel.
raw-window-handle = "0.6"
rfd.workspace = true
uuid.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
# Skia, to compare with femtovg (`BUBBLE_RENDERER=skia`).
slint = { version = "=1.18.1", features = ["renderer-skia"] }
# The app menu Slint creates (Quit routed through the unsaved-changes question,
# Settings… and a Window menu) and native alerts (same versions winit already uses).
objc2 = "0.6"
dispatch2 = "0.3"
block2 = "0.6"
# San Francisco's Text design as a static font (fonts.rs).
allsorts = { version = "0.15", default-features = false, features = ["flate2_rust"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "block2", "NSAlert", "NSApplication", "NSAppearance", "NSButton", "NSColor", "NSColorPanel", "NSColorSpace", "NSControl", "NSImage", "NSMenu", "NSMenuItem", "NSPanel", "NSPopUpButton", "NSResponder", "NSSavePanel", "NSText", "NSTextField", "NSView", "NSWindow"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSData", "NSGeometry", "NSString", "NSURL", "NSUserDefaults"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_LibraryLoader", "Win32_UI_Controls", "Win32_UI_Controls_Dialogs", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
slint-build = "=1.18.1"
resvg.workspace = true
