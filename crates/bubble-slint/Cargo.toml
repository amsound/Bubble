[package]
name = "bubble-slint"
description = "Bubble cart player: the Slint interface (main window), on top of bubble-core."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "bubble-slint"
path = "src/main.rs"

[dependencies]
bubble-control = { path = "../bubble-control" }
bubble-core = { path = "../bubble-core" }
bubble-project = { path = "../bubble-project" }
# Bubble is GPL-3.0-or-later, so Slint is used under its GPLv3 licence (D-38).
# `unstable-winit-030`: OS file drops, physical keys and the window's place, which
# Slint's own API does not report yet. Pinned: the winit accessor may change.
slint = { version = "=1.18.1", features = ["unstable-winit-030", "raw-window-handle-06"] }
mouse_position = "0.1.4"
rfd.workspace = true
uuid.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
# Skia draws text much closer to macOS's own than femtovg does.
slint = { version = "=1.18.1", features = ["renderer-skia"] }
# The app menu Slint creates: Quit routed through the unsaved-changes question,
# Settings… and a Window menu (same versions winit already uses).
objc2 = "0.6"
allsorts = { version = "0.15", default-features = false, features = ["flate2_rust"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSAppearance", "NSMenu", "NSMenuItem", "NSResponder"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSUserDefaults"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
slint-build = "=1.18.1"
resvg.workspace = true
