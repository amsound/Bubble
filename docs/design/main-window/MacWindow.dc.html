<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Main window, macOS</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#2f6bff}a:hover{color:#1d4fd1}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.25}}
@keyframes shimmer{0%{transform:translateX(-100%)}100%{transform:translateX(290%)}}
</style>
</helmet>
<div style="width: 1280px; height: 840px; box-sizing: border-box; background: linear-gradient(160deg, #3a4a63, #1f2633); font-family: -apple-system, 'SF Pro Text', system-ui, sans-serif; display: flex; flex-direction: column">
  <!-- System menu bar (top of the screen, not the window) -->
  <div style="height: 26px; flex-shrink: 0; display: flex; align-items: center; gap: 20px; padding: 0 16px; background: rgba(30,32,38,0.72); color: #f2f2f2; font-size: 13px">
    <svg width="14" height="16" viewBox="0 0 14 16" aria-hidden="true"><path d="M11.4 8.5c0-1.9 1.6-2.8 1.6-2.9-.9-1.3-2.2-1.4-2.7-1.5-1.1-.1-2.2.7-2.8.7-.6 0-1.5-.7-2.4-.7C3.9 4.1 2.7 4.8 2 6c-1.4 2.5-.4 6.1 1 8.1.7 1 1.5 2 2.5 2s1.4-.6 2.6-.6 1.5.6 2.5.6 1.7-1 2.4-2c.8-1.1 1.1-2.2 1.1-2.3 0 0-2.7-1-2.7-3.3zM9.5 2.8c.5-.7.9-1.6.8-2.5-.8 0-1.8.5-2.3 1.2-.5.6-.9 1.5-.8 2.4.9.1 1.8-.4 2.3-1.1z" fill="#f2f2f2"/></svg>
    <span style="font-weight: 700">Bubble</span>
    <span>File</span><span>Edit</span><span>Session</span><span>Cart</span><span>Audio</span><span>View</span><span>Window</span><span>Help</span>
  </div>

  <div style="flex: 1; display: flex; align-items: center; justify-content: center; padding: 18px 40px 26px">
    <!-- Window -->
    <div style="width: 1180px; height: 760px; border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; background: {{c.window}}; box-shadow: 0 22px 60px rgba(0,0,0,0.5), 0 0 0 0.5px rgba(255,255,255,0.18)">
      <!-- Native title bar -->
      <div style="height: 30px; flex-shrink: 0; position: relative; display: flex; align-items: center; justify-content: center; background: {{c.title}}; border-bottom: 1px solid {{c.line}}">
        <div style="position: absolute; left: 12px; top: 9px; display: flex; gap: 8px">
          <span style="width: 12px; height: 12px; border-radius: 50%; background: #ff5f57"></span>
          <span style="width: 12px; height: 12px; border-radius: 50%; background: #febc2e"></span>
          <span style="width: 12px; height: 12px; border-radius: 50%; background: #28c840"></span>
        </div>
        <span style="font-size: 13px; font-weight: 600; color: {{c.titleText}}">Bubble - Breakfast Show &gt; Last saved at 07:42</span>
      </div>

      <!-- Content: wall with the busy strip floating over its top -->
      <div style="flex: 1; position: relative; padding: 6px; display: grid; grid-template-columns: repeat(5, 228px); grid-template-rows: repeat(3, 216px); gap: 6px">
        <sc-for list="{{tiles}}" as="t" hint-placeholder-count="15">
          <dc-import name="Tile" t="{{t}}" w="{{tw}}" h="{{th}}" hint-size="228px,216px"></dc-import>
        </sc-for>

        <!-- Busy popover: the one place for "Bubble is busy". Non-modal, top centre,
             floats over the wall; ready carts stay playable underneath. -->
        <div style="position: absolute; left: 50%; top: 10px; transform: translateX(-50%); width: 440px; border-radius: 12px; padding: 10px 12px 12px 14px; box-sizing: border-box; background: rgba(50,53,58,0.96); color: #ffffff; box-shadow: 0 0 0 0.5px rgba(255,255,255,0.2), 0 10px 28px rgba(0,0,0,0.5); display: flex; flex-direction: column; gap: 9px; font-size: 13px">
          <div style="display: flex; align-items: center; gap: 10px">
            <span style="width: 14px; height: 14px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.3); border-top-color: #0a84ff; animation: spin 0.9s linear infinite"></span>
            <b style="font-size: 13px">Loading audio</b>
            <span style="flex: 1"></span>
            <span style="font-variant-numeric: tabular-nums; color: #c8cbd0">12 of 32 files</span>
            <button type="button" aria-label="Hide" style="width: 20px; height: 20px; padding: 0; border-radius: 50%; border: 0; background: rgba(255,255,255,0.12); color: #c8cbd0; font-size: 12px; line-height: 20px">✕</button>
          </div>
          <div style="height: 5px; border-radius: 3px; background: rgba(255,255,255,0.15); overflow: hidden"><div style="width: 37%; height: 5px; border-radius: 3px; background: #0a84ff"></div></div>
          <div style="display: flex; align-items: center; gap: 10px; padding-top: 2px; border-top: 1px solid rgba(255,255,255,0.08)">
            <svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2v7.5M5 6.5l3 3 3-3M2.5 10.5v2a1 1 0 0 0 1 1h9a1 1 0 0 0 1-1v-2" fill="none" stroke="#8fb0ff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path></svg>
            <span style="flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">Copying Weather Bed v3.wav to cell 7</span>
            <span style="font-variant-numeric: tabular-nums; color: #c8cbd0">38%</span>
          </div>
          <div style="height: 5px; border-radius: 3px; background: rgba(255,255,255,0.15); overflow: hidden"><div style="width: 38%; height: 5px; border-radius: 3px; background: #8fb0ff"></div></div>
        </div>
      </div>

      <!-- Bottom bar -->
      <div style="height: 54px; flex-shrink: 0; display: flex; align-items: center; gap: 6px; padding: 0 6px; background: {{c.bar}}">
        <span style="width: 64px; height: 42px; border-radius: 6px; background: #f09a2a; color: #fff; font-size: 13px; font-weight: 700; display: flex; align-items: center; justify-content: center">EDIT</span>
        <span style="width: 6px"></span>
        <sc-for list="{{pages}}" as="p" hint-placeholder-count="4">
          <span style="{{p.style}}">{{p.name}}<sc-if value="{{p.top}}" hint-placeholder-val="{{false}}"><span style="{{p.top}}"></span></sc-if></span>
        </sc-for>
        <span style="width: 42px; height: 42px; border-radius: 6px; background: {{c.button}}; color: {{c.text}}; display: flex; align-items: center; justify-content: center; font-size: 18px">+</span>
        <span style="flex: 1; text-align: right; font-size: 12px; color: #f09a2a; padding-right: 8px">2 missing files</span>
        <span style="width: 130px; height: 42px; border-radius: 6px; background: {{c.button}}; color: {{c.text}}; font-size: 13px; font-weight: 700; display: flex; align-items: center; justify-content: center">■ PAGE STOP</span>
        <span style="width: 168px; height: 42px; border-radius: 6px; background: #b02020; color: #fff; font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center">■ ALL STOP</span>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;dark&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true},&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:840}}">
class Component extends DCLogic {
  renderVals() {
    const dark = this.props.dark ?? true;
    const c = dark
      ? { window: '#1b1d21', title: '#2a2d33', titleText: '#d8dadd', line: '#000000', bar: '#24272c', button: '#3a3f46', text: '#e8e8e8', empty: '#363a40', emptyMark: '#6a7078' }
      : { window: '#eceef1', title: '#e6e8eb', titleText: '#3d434b', line: '#c5cad1', bar: '#dde1e6', button: '#c7cdd5', text: '#1c1f23', empty: '#d5dae0', emptyMark: '#8a929c' };
    const light = !dark;
    const tiles = [
      { num: 1, label: 'Opening Titles', bg: '#2E7D32', key: 'F1', out: 'A', time: '00:31' },
      { num: 2, label: 'Bed Music', bg: '#3A6EA5', state: 'playing', out: 'A', icons: ['loop'], time: '-01:12', progress: 0.42 },
      { num: 3, label: 'Applause', bg: '#EF6C00', state: 'fading', out: 'A', time: '-00:03', progress: 0.91 },
      { num: 4, label: 'Sting 2', bg: '#6A1B9A', group: 'G1 Stings', key: 'F2', out: 'A', icons: ['stop', 'inout'], time: '00:04' },
      { num: 5, label: 'Phone Ring', bg: '#00838F', out: 'B', rerouted: true, icons: ['hold'], time: '00:12' },
      { num: 6, label: 'Interview Bed', bg: '#3A6EA5', state: 'missing', out: 'A', time: 'MISSING' },
      { num: 7, state: 'copying', light },
      { num: 8, label: 'Weather Intro', bg: '#3A6EA5', selected: true, out: 'A', icons: ['in'], time: '00:09' },
      { num: 9, label: 'STOP GROUP', bg: '#545B64', group: 'G1 Stings', state: 'control' },
      { num: 10, label: 'Traffic', bg: '#AD1457', key: 'F5', state: 'learning', out: 'A', time: '00:07' },
      { num: 11, label: 'Ident Long', bg: '#3A6EA5', state: 'loading', out: 'A', time: '00:45' },
      { num: 12, label: 'Morning|News', bg: '#C62828', out: 'A', icons: ['next', 'midi'], time: '00:41' },
      { num: 13, state: 'empty', light },
      { num: 14, state: 'empty', light },
      { num: 15, state: 'empty', light }
    ];
    // Page tabs: the current page inverted (neutral); a yellow bar along the top when
    // something on the page plays. The name never moves.
    const tab = (name, current, playing) => ({ name, top: playing ? 'position: absolute; left: 0; right: 0; top: 0; height: 5px; background: #ffd82e' : '', style: 'position: relative; overflow: hidden; box-sizing: border-box; width: 120px; height: 42px; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 14px; ' + (current ? 'background: ' + c.text + '; color: ' + c.window + '; font-weight: 700' : 'background: ' + c.button + '; color: ' + c.text) });
    return { c, tiles, tw: 228, th: 216, pages: [tab('Morning', true, true), tab('Music', false, true), tab('Ads'), tab('Idents')] };
  }
}
</script>
</body>
</html>
